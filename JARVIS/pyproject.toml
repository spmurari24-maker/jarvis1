[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-assistant-core"
version = "0.1.0"
description = "A local-first, safety-focused foundation for a modular personal assistant."
readme = "README.md"
requires-python = ">=3.11,<4"
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1", "PyYAML>=6,<7", "cryptography>=42,<47"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
jarvis = "jarvis.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["jarvis*"]

[tool.setuptools.package-data]
jarvis = ["skills/**/*.yaml", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

